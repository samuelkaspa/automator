name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip Automator.zip
      - name: Corrigir Engine.kt
        run: sed -i 's/stopped = true; stopSpam();/stopped = true; spamT?.interrupt(); spamT = null;/' Automator/app/src/main/java/com/example/automator/Engine.kt
      - name: Corrigir checagem de acessibilidade
        run: sed -i 's|ClickService.inst == null|!Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES).orEmpty().contains(packageName)|' Automator/app/src/main/java/com/example/automator/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
        working-directory: Automator
      - uses: actions/upload-artifact@v4
        with:
          name: Automator-APK
          path: Automator/app/build/outputs/apk/debug/app-debug.apk
